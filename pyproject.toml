[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "porous-designer"
version = "0.1.0"
description = "AGE (Agentic Geometry Engineering) — natural-language design of printable porous structures"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Federica Research Lab" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "trimesh>=4.0",
    "fast-simplification>=0.1.13",
    "gmsh>=4.12",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "PyYAML>=6.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6",
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
    "psutil>=5.9",
]
llm = [
    "httpx>=0.27",
    "keyring>=25.0",
]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-timeout>=2.3",
]
web = [
    "starlette>=0.36",
    "uvicorn>=0.27",
]
all = ["porous-designer[gui,llm,web,dev]"]

[project.scripts]
porous-designer = "porous_designer.cli:main"
porous-designer-gui = "porous_designer.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"porous_designer.agentic" = ["prompts/*.txt"]
"porous_designer.printability" = ["profiles/*.yaml"]
"porous_designer.knowledge" = ["data/*.yaml", "data/*.json"]
"porous_designer.api" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ""
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gui: marks tests requiring PySide6",
    "live_provider: marks tests that call a live provider (need an OpenRouter key; spend free-tier requests)",
]
