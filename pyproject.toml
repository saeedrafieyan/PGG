[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "porous-designer"
version = "0.1.0"
description = "Porous Structure Designer — deterministic porous scaffold generation for research"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Federica Research Lab" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "trimesh>=4.0",
    "fast-simplification>=0.1.13",
    "gmsh>=4.12",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "PyYAML>=6.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6",
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
]
llm = [
    "httpx>=0.27",
]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
]
all = ["porous-designer[gui,llm,dev]"]

[project.scripts]
porous-designer = "porous_designer.cli:main"
porous-designer-gui = "porous_designer.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:pytestqt"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gui: marks tests requiring PySide6",
]
